[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"


[project]
name = "offline-ai-companion"
version = "0.1.0"
description = "Personal Offline Always-On AI Companion"
requires-python = ">=3.13,<3.14"
dependencies = [
    "python-dotenv>=1.0,<2.0",
]


[project.scripts]
offline-ai-companion = "offline_ai_companion.main:main"


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]